<style>
  :root {
    --navy: #0D1B3E;
    --navy-soft: #16285a;
    --amber: #FFBD59;

    --paper: #F7F8FC;

  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--paper);
    background-color: #F7F8FC;
    margin: 0;
    padding: 0;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;

    padding: 22px 18px 60px;
    background: #F7F8FC;

  }

    background: var(--navy);
    border-radius: 28px;
    padding: 30px 26px 26px;
    color: #fff;
    text-align: center;
    box-shadow: 0 12px 30px rgba(13,27,62,0.25);
  }
  .brand .mark {
    width: 62px;
    height: 62px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,189,89,0.55);

    align-items: center;

  }
  .brand .mark svg { width: 34px; height: 34px; }
  .brand .word {

    color: var(--amber);
    margin: 0 0 4px;
    font-family: Georgia, serif;
  }
  .brand h1 {

    margin: 6px 0 8px;

  }

  }
  .card {

    margin-top: 18px;

  }

  .meta-item .lbl { font-size: 12.5px; color: var(--ink-soft); font-family: Arial, sans-serif; }

    font-family: Georgia, serif;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    background: var(--amber);
    color: var(--navy);
    font-size: 17px;
    font-weight: 700;
    padding: 16px 18px;
    border-radius: 16px;
    margin-top: 20px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover { background: var(--amber-deep); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--navy);
    font-size: 15px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 16px;
    margin-top: 10px;
    border: 1.5px solid var(--line);
  }
  .axis-legend {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 16px;
  }
  .axis-chip {
    flex: 1;
    background: var(--paper);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  .axis-chip .l { font-size: 15px; font-weight: 700; color: var(--navy); }
  .axis-chip .s { font-size: 10.5px; color: var(--ink-soft); display: block; margin-top: 2px; }

  /* progress */
  .progress-wrap { margin-bottom: 22px; }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 8px;
    background: var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 6px;
    transition: width 0.25s ease;
  }

  .question-text {
    font-size: 20px;
    line-height: 1.4;
    color: var(--navy);
    margin: 4px 0 22px;
    font-weight: 700;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 12px;
    font-family: Georgia, serif;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .choice:hover {
    border-color: var(--amber);
    background: #FFF7EA;
  }
  .choice .k {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    line-height: 22px;
    margin-right: 10px;
  }
  .back-link {
    display: inline-block;
    margin-top: 4px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: underline;
    background: none;
    padding: 0;
  }

  /* results */
  .code-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 6px 0 4px;
  }
  .code-tile {
    width: 58px;
    height: 58px;
    background: var(--navy);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.5s ease forwards;
  }

  .code-tile:nth-child(2) { animation-delay: 0.2s; }

  .code-tile:nth-child(4) { animation-delay: 0.5s; }

    margin-bottom: 10px;
    font-family: Arial, sans-serif;
  }

    color: var(--ink-soft);
    width: 62px;
  }
  .axis-bar-row .name-r { text-align: right; }
  .axis-bar-track {

    height: 10px;
    background: var(--line);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .axis-bar-fill {
    height: 100%;
    background: var(--amber);

  .axis-bar-track-50 {

    display: flex;
    align-items: center;
    height: 16px;
  }
  .axis-bar-half {
    flex: 1;
    height: 10px;
    background: var(--line);
    border-radius: 6px;

    display: flex;

  .axis-bar-fill-l, .axis-bar-fill-r {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
  }
  .axis-bar-fill-l { border-radius: 6px 0 0 6px; justify-content: flex-start; padding-left: 4px; }
  .axis-bar-fill-r { border-radius: 0 6px 6px 0; justify-content: flex-end; padding-right: 4px; }
  .axis-bar-center {
    width: 2px;
    height: 16px;
    background: #C7CDE0;
    flex-shrink: 0;
  }
  .axis-band-note {
    font-family: Arial, sans-serif;
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    margin: 2px 0 12px;
  }
  footer.disclaimer {
    margin-top: 26px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #9AA1B8;
    line-height: 1.5;
  }
  .gate-input {
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 20px;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
    padding: 16px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    margin-top: 6px;
    color: var(--navy);
  }
  .gate-input:focus { outline: none; border-color: var(--amber); }
  .gate-error {
    font-family: Arial, sans-serif;
    font-size: 13.5px;
    color: #C2410C;
    margin-top: 10px;
    text-align: center;
  }
  .gate-label {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    display: block;
    margin-top: 4px;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(13,27,62,0.25);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .app { max-width: 100%; padding: 0; }
  }
</style>

var Q_C_R = [
  ["Face à une décision importante, tu écoutes d'abord ce que tu ressens.", "Face à une décision importante, tu analyses d'abord les faits."],
  ["Dans un désaccord, tu penses avant tout à préserver la relation.", "Dans un désaccord, tu penses avant tout à trouver qui a objectivement raison."],
  ["Tu choisirais une voie professionnelle qui a du sens pour les autres.", "Tu choisirais une voie professionnelle qui est logique et cohérente sur le papier."],

var Q_O_A = [
  ["Tu préfères avoir un planning clair pour la semaine.", "Tu préfères garder de la place pour l'imprévu."],
  ["Tu finis tes devoirs bien avant la date limite.", "Tu travailles souvent mieux sous la pression du dernier moment."],

  ["Une règle claire te rassure.", "Une règle trop stricte te pèse vite."],
  ["Tu préfères un métier avec des horaires et un cadre stables.", "Tu préfères un métier où chaque journée est différente."],
  ["Tu te sens plus efficace avec des listes et des méthodes.", "Tu te sens plus efficace en improvisant selon la situation."],
  ["Changer un plan au dernier moment te dérange.", "Changer un plan au dernier moment ne te dérange pas, voire ça t'excite."],
  ["Tu préfères terminer une chose avant de commencer la suivante.", "Tu aimes avoir plusieurs projets en cours en même temps."],
  ["Tu prépares longtemps à l'avance un exposé ou un examen.", "Tu prépares au fur et à mesure, quitte à finir juste à temps."],

  ["Tu te sens à l'aise dans le silence et la concentration seule.", "Tu te sens à l'aise dans le bruit et l'énergie d'un groupe."],
  ["Tu avances plus vite quand tu es autonome.", "Tu avances plus vite quand tu es porté par une équipe."],

var RAW_BLOCKS = [Q_T_V, Q_C_R, Q_O_A, Q_S_D];

// interleave the four blocks so the test doesn't feel grouped by theme.
// Each item keeps only the statement phrased for the axis's left-hand letter
// (Terrain / Cœur / Organisé / Solo) ; the response scale below covers agreement
// or disagreement with it, which naturally covers the opposite letter too.
var QUESTIONS = [];
for (var i = 0; i < 15; i++) {
  for (var ax = 0; ax < 4; ax++) {
    var pair = RAW_BLOCKS[ax][i];
    QUESTIONS.push({ axis: ax, text: pair[0] });
  }
}

var LIKERT_OPTIONS = [
  { label: "Complètement vrai", score: 2 },
  { label: "Plutôt vrai", score: 1 },
  { label: "Je ne sais pas", score: 0 },
  { label: "Plutôt faux", score: -1 },
  { label: "Complètement faux", score: -2 }
];

// Each axis has 15 items scored from -2 to +2, so the raw sum per axis
// ranges from -30 to +30. We rescale the absolute value onto a 1-50 scale
// (a perfect 0-0 tie is defined not to occur : it defaults to a minimal
// lean of 1 on the left-hand letter, so the result always names a direction).
function computeAxisResult(axisIndex) {
  var raw = state.rawSums[axisIndex];
  var scaled = Math.round((Math.abs(raw) * 50) / 30);
  if (scaled < 1) { scaled = 1; }
  if (scaled > 50) { scaled = 50; }
  var axis = AXES[axisIndex];
  var side = raw >= 0 ? "left" : "right";
  var winning = side === "left" ? axis.left : axis.right;
  var band = scaled <= 10 ? "tendance faible" : (scaled <= 25 ? "tendance moyenne" : "tendance forte");
  return { axis: axis, side: side, value: scaled, band: band, letter: winning.letter, label: winning.label };
}

var TYPES = {};

function addType(code, name, baseline, portrait, forces, vigilance, environnement, etudes, metiers, conseil) {
  TYPES[code] = {
    name: name, baseline: baseline, portrait: portrait, forces: forces,
    vigilance: vigilance, environnement: environnement, etudes: etudes,
    metiers: metiers, conseil: conseil
  };
}

  ["Tu peux abandonner un projet dès qu'il devient répétitif.", "Tu peux avoir du mal à respecter des procédures ou des délais imposés.", "Tu peux te disperser entre plusieurs idées à la fois."],

  ["Écoles d'ingénieurs orientées innovation ou recherche appliquée", "Formations en entrepreneuriat et création de startup", "Licence puis Master en informatique ou sciences appliquées", "Formations en design de produits ou UX", "Diplômes en recherche scientifique indépendante"],

  ["Tu perçois vite les opportunités et les tendances émergentes.", "Tu fédères une équipe autour d'une vision ambitieuse.", "Tu t'adaptes rapidement quand un projet change de direction.", "Tu combines esprit stratégique et énergie collective."],
  ["Tu peux t'enflammer pour une idée sans toujours vérifier sa solidité.", "Tu peux manquer de suivi sur les détails d'exécution.", "Tu t'ennuies vite dans un cadre trop stable ou trop répétitif."],
  "Tu t'épanouis dans des environnements en mouvement rapide, comme les startups ou les projets d'innovation collective, où tu peux porter une vision avec d'autres.",
  ["Écoles de commerce ou d'ingénieurs orientées innovation", "Formations en entrepreneuriat collectif", "Master en stratégie ou management de l'innovation", "Formations en gestion de produit (product management)", "Sciences politiques avec spécialisation en prospective"],
  ["Chef de produit (product manager)", "Consultant en innovation ou en stratégie", "Cofondateur de startup", "Directeur de l'innovation", "Chargé de prospective ou de veille stratégique", "Chef de projet en transformation d'entreprise"],
  "Entoure-toi de quelqu'un de plus méthodique que toi pour transformer tes idées en projets vraiment aboutis. C'est un complément, pas un frein.");

// ---------- STATE ----------

var state = {
  screen: "gate",
  index: 0,
  answers: [],
  rawSums: [0, 0, 0, 0],
  gateError: "",
  gateLoading: false,
  gateRemaining: null
};

function compassSVG() {
  return '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="24" cy="24" r="17" stroke="#FFBD59" stroke-width="2"/>' +
    '<path d="M24 10 L28 24 L24 38 L20 24 Z" fill="#FFBD59"/>' +
    '<circle cx="24" cy="24" r="2.4" fill="#0D1B3E" stroke="#FFBD59" stroke-width="1"/>' +
    '</svg>';
}

function render() {
  var el = document.getElementById("app");
  if (state.screen === "gate") { el.innerHTML = renderGate(); bind(); return; }
  if (state.screen === "intro") { el.innerHTML = renderIntro(); bind(); return; }
  if (state.screen === "quiz") { el.innerHTML = renderQuiz(); bind(); return; }
  if (state.screen === "result") { el.innerHTML = renderResult(); bind(); return; }
}

function renderGate() {
  var html = "";
  html += '<div class="brand">';
  html += '<div class="mark">' + compassSVG() + '</div>';
  html += '<p class="word">A4P MENTAL</p>';
  html += '<h1>Ta Boussole d\'orientation</h1>';
  html += '<p class="tag">Trouve ton Code CAP</p>';
  html += '</div>';
  html += '<div class="card">';

  if (!supabaseClient) {
    html += '<p class="lead">La vérification des codes d\'accès n\'est pas encore activée sur cette installation (configuration Supabase à compléter dans le fichier).</p>';
    html += '<p class="lead">En attendant, tu peux tester librement l\'outil : aucun passage ne sera compté tant que ce n\'est pas activé.</p>';
    html += '<button class="btn-primary" id="test-mode-btn">Continuer en mode test</button>';
    html += '</div>';
    html += disclaimer();
    return html;
  }

  html += '<p class="lead">Cet outil est réservé aux personnes ayant reçu un code d\'accès de leur coach A4P Mental.</p>';
  html += '<span class="gate-label">Code d\'accès</span>';
  html += '<input class="gate-input" id="gate-code" type="text" placeholder="EX. AB12CD" maxlength="20" autocomplete="off" ' + (state.gateLoading ? 'disabled' : '') + '>';
  if (state.gateError) {
    html += '<p class="gate-error">' + state.gateError + '</p>';
  }
  html += '<button class="btn-primary" id="gate-btn" ' + (state.gateLoading ? 'disabled' : '') + '>';
  html += state.gateLoading ? '<span class="spinner"></span>Vérification...' : 'Valider mon code';
  html += '</button>';
  html += '</div>';
  html += disclaimer();
  return html;
}

function submitGateCode() {
  var input = document.getElementById("gate-code");
  var code = (input.value || "").trim().toUpperCase();

  if (!code) {
    state.gateError = "Merci de saisir ton code d'accès.";
    render();
    return;
  }

  if (!supabaseClient) {
    state.gateError = "La configuration d'accès n'est pas encore activée. Contacte ton coach.";
    render();
    return;
  }

  state.gateLoading = true;
  state.gateError = "";
  render();

  supabaseClient.rpc("cap_consume_attempt", { p_code: code }).then(function (response) {
    state.gateLoading = false;
    var data = response.data;
    var error = response.error;

    if (error || !data || !data[0]) {
      state.gateError = "Une erreur est survenue, réessaie dans un instant.";
      render();
      return;
    }

    var result = data[0];
    if (!result.success) {
      state.gateError = result.message || "Code invalide.";
      render();
      return;
    }

    state.gateRemaining = result.remaining;
    state.screen = "intro";
    render();
    window.scrollTo(0, 0);
  }).catch(function () {
    state.gateLoading = false;
    state.gateError = "Impossible de vérifier le code pour le moment.";
    render();
  });
}

function renderIntro() {
  var html = "";
  html += '<div class="brand">';
  html += '<div class="mark">' + compassSVG() + '</div>';
  html += '<p class="word">A4P MENTAL</p>';
  html += '<h1>Ta Boussole d\'orientation</h1>';
  html += '<p class="tag">Trouve ton Code CAP</p>';
  html += '</div>';
  html += '<div class="card">';
  html += '<p class="lead">60 questions, un peu comme un test de personnalité classique, mais construites pour t\'aider à voir <strong>vers quelles études et quels métiers tu es naturellement porté</strong>.</p>';
  html += '<p class="lead">Réponds spontanément, sans trop réfléchir : il n\'y a pas de bonne ou de mauvaise réponse, seulement la tienne.</p>';
  if (state.gateRemaining !== null && state.gateRemaining !== undefined) {
    html += '<p class="gate-label" style="margin-bottom:10px;">Passages restants avec ce code : ' + state.gateRemaining + '</p>';
  }
  html += '<div class="meta-line">';
  html += '<div class="meta-item"><div class="num">60</div><div class="lbl">questions</div></div>';
  html += '<div class="meta-item"><div class="num">4</div><div class="lbl">dimensions</div></div>';
  html += '<div class="meta-item"><div class="num">~8</div><div class="lbl">minutes</div></div>';
  html += '</div>';
  html += '<div class="axis-legend">';
  html += axisChip("T", "Terrain") + axisChip("V", "Vision");
  html += axisChip("C", "Cœur") + axisChip("R", "Raison");
  html += '</div>';
  html += '<div class="axis-legend">';
  html += axisChip("O", "Organisé") + axisChip("A", "Adaptable");
  html += axisChip("S", "Solo") + axisChip("D", "Duo");
  html += '</div>';
  html += '<button class="btn-primary" id="start-btn">Commencer le test</button>';
  html += '</div>';
  html += disclaimer();
  return html;
}

function axisChip(letter, label) {
  return '<div class="axis-chip"><span class="l">' + letter + '</span><span class="s">' + label + '</span></div>';
}

function renderQuiz() {
  var q = QUESTIONS[state.index];
  var pct = Math.round((state.index / QUESTIONS.length) * 100);
  var html = "";
  html += '<div class="card">';
  html += '<div class="progress-wrap">';
  html += '<div class="progress-top"><span>Question ' + (state.index + 1) + ' / ' + QUESTIONS.length + '</span><span>' + pct + '%</span></div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  html += '</div>';
  html += '<p class="question-text">' + q.text + '</p>';
  for (var i = 0; i < LIKERT_OPTIONS.length; i++) {
    html += '<button class="choice" data-score="' + LIKERT_OPTIONS[i].score + '"><span class="k">' + (i + 1) + '</span>' + LIKERT_OPTIONS[i].label + '</button>';
  }
  if (state.index > 0) {
    html += '<button class="back-link" id="back-btn">← Question précédente</button>';
  }
  html += '</div>';
  return html;
}

function renderResult() {
  var code = "";
  var axisResults = [];
  for (var i = 0; i < 4; i++) {
    var r = computeAxisResult(i);
    axisResults.push(r);
    code += r.letter;
  }
  var t = TYPES[code];
  var html = "";
  html += '<div class="brand" style="padding-bottom:22px;">';
  html += '<div class="mark">' + compassSVG() + '</div>';
  html += '<p class="word">TON CODE CAP</p>';
  html += '<div class="code-row">';
  for (var c = 0; c < code.length; c++) {
    html += '<div class="code-tile">' + code[c] + '</div>';
  }
  html += '</div>';
  html += '</div>';
  html += '<div class="card">';
  html += '<p class="type-name">' + t.name + '</p>';
  html += '<p class="type-baseline">' + t.baseline + '</p>';
  html += '<div class="axis-bars">';
  for (var j = 0; j < 4; j++) {
    html += renderAxisBarRow(axisResults[j]);
  }
  html += '</div>';

  html += '<p class="section-title">Ton portrait</p>';
  html += '<p class="report-p">' + t.portrait + '</p>';

  html += '<p class="section-title">Tes forces</p>';
  html += '<ul class="report-list">' + listItems(t.forces) + '</ul>';

  html += '<p class="section-title">Tes points de vigilance</p>';
  html += '<ul class="report-list">' + listItems(t.vigilance) + '</ul>';

  html += '<p class="section-title">Où tu t\'épanouis</p>';
  html += '<p class="report-p">' + t.environnement + '</p>';

  html += '<p class="section-title">Pistes d\'études</p>';
  html += '<ul class="report-list">' + listItems(t.etudes) + '</ul>';

  html += '<p class="section-title">Pistes de métiers</p>';
  html += '<ul class="report-list">' + listItems(t.metiers) + '</ul>';

  html += '<div class="coach-box"><p class="who">Le conseil du coach</p><p>' + t.conseil + '</p></div>';

  html += '<button class="btn-primary no-print" id="print-btn">Imprimer / enregistrer mon compte rendu</button>';
  html += '<button class="btn-secondary no-print" id="restart-btn">Refaire le test</button>';
  html += '</div>';
  html += disclaimer();
  return html;
}

function renderAxisBarRow(r) {
  var leftFillPct = r.side === "left" ? Math.round((r.value / 50) * 100) : 0;
  var rightFillPct = r.side === "right" ? Math.round((r.value / 50) * 100) : 0;
  var leftText = r.side === "left" ? (r.axis.left.letter + " " + r.value) : r.axis.left.letter;
  var rightText = r.side === "right" ? (r.axis.right.letter + " " + r.value) : r.axis.right.letter;
  var html = "";
  html += '<div class="axis-bar-row">';
  html += '<span class="name-l">' + r.axis.left.label + '</span>';
  html += '<div class="axis-bar-track-50">';
  html += '<div class="axis-bar-half axis-bar-half-l"><div class="axis-bar-fill-l" style="width:' + leftFillPct + '%"></div></div>';
  html += '<div class="axis-bar-center"></div>';
  html += '<div class="axis-bar-half axis-bar-half-r"><div class="axis-bar-fill-r" style="width:' + rightFillPct + '%"></div></div>';
  html += '</div>';
  html += '<span class="name-r">' + r.axis.right.label + '</span>';
  html += '</div>';
  html += '<p class="axis-band-note">' + (r.side === "left" ? r.axis.left.label : r.axis.right.label) + ' ' + r.value + '/50 · ' + r.band + '</p>';
  return html;
}

function listItems(arr) {
  var out = "";
  for (var i = 0; i < arr.length; i++) { out += '<li>' + arr[i] + '</li>'; }
  return out;
}

function disclaimer() {
  return '<footer class="disclaimer">Ce test est un outil de réflexion sur toi-même, pas une vérité figée pour la vie.<br>Pour aller plus loin, parles-en avec ton coach A4P Mental.</footer>';
}

function bind() {
  var testModeBtn = document.getElementById("test-mode-btn");
  if (testModeBtn) testModeBtn.onclick = function () {
    state.screen = "intro";
    render();
    window.scrollTo(0,0);
  };

  var gateBtn = document.getElementById("gate-btn");
  if (gateBtn) gateBtn.onclick = submitGateCode;

  var gateInput = document.getElementById("gate-code");
  if (gateInput) {
    gateInput.focus();
    gateInput.onkeydown = function (e) {
      if (e.key === "Enter") { submitGateCode(); }
    };
  }

  var startBtn = document.getElementById("start-btn");
  if (startBtn) startBtn.onclick = function () { state.screen = "quiz"; state.index = 0; render(); window.scrollTo(0,0); };

  var backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.onclick = function () {
    if (state.index > 0) {
      var last = state.answers.pop();
      state.rawSums[last.axis] -= last.score;
      state.index -= 1;
      render();
      window.scrollTo(0,0);
    }
  };

  var choices = document.querySelectorAll(".choice");
  for (var i = 0; i < choices.length; i++) {
    choices[i].onclick = function (e) {
      var score = parseInt(e.currentTarget.getAttribute("data-score"), 10);
      var axis = QUESTIONS[state.index].axis;
      state.rawSums[axis] += score;
      state.answers.push({ axis: axis, score: score });
      state.index += 1;
      if (state.index >= QUESTIONS.length) {
        state.screen = "result";
      }
      render();
      window.scrollTo(0,0);
    };
  }

  var printBtn = document.getElementById("print-btn");
  if (printBtn) printBtn.onclick = function () { window.print(); };

  var restartBtn = document.getElementById("restart-btn");
  if (restartBtn) restartBtn.onclick = function () {
    state = {
      screen: "gate", index: 0, answers: [], rawSums: [0, 0, 0, 0],
      gateError: "", gateLoading: false, gateRemaining: null
    };
    render();
    window.scrollTo(0,0);
  };
}

render();
</script>
